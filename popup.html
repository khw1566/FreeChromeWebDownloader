<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Downloader Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <svg class="icon-main" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <h1 data-i18n="app_title">미디어 다운로더</h1>
      </div>
      <div class="lang-switch-wrapper">
        <svg class="icon-globe" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <button id="langToggleBtn" class="btn-lang" type="button">KO</button>
      </div>
    </header>

    <div class="main-tabs">
      <button class="main-tab-btn active" data-tab="media" type="button">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <span data-i18n="tab_media">미디어 다운로드</span>
      </button>
      <button class="main-tab-btn" data-tab="video-converter" type="button">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="10 8 16 12 10 16 10 8"></polygon>
        </svg>
        <span data-i18n="tab_video_converter">동영상 변환</span>
      </button>
      <button class="main-tab-btn" data-tab="image-converter" type="button">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span data-i18n="tab_image_converter">이미지 변환</span>
      </button>
    </div>

    <!-- 1. 미디어 다운로드 탭 영역 -->
    <div id="mediaTabSection" class="tab-section active">
      <nav class="nav-controls">
        <div class="filter-group">
          <button class="btn-filter active" data-filter="all" data-i18n="filter_all" type="button">전체</button>
          <button class="btn-filter" data-filter="video" data-i18n="filter_video" type="button">비디오</button>
          <button class="btn-filter" data-filter="audio" data-i18n="filter_audio" type="button">오디오</button>
        </div>
        <button id="rescanBtn" class="btn-icon-text" type="button">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          <span data-i18n="scan_page">스캔</span>
        </button>
      </nav>

      <section class="download-controls" aria-label="다운로드 설정">
        <div class="download-settings">
          <label>저장 형식 <select id="downloadFormat"><option value="video">영상 / 원본</option><option value="mp3">MP3 음원</option></select></label>
          <label>화질 <select id="pageQuality"><option value="1080">1080p · 기본</option><option value="720">최대 720p</option><option value="best">최고 화질 · 대용량</option></select></label>
          <button id="helperStatusBtn" class="btn-action" type="button">연결 확인</button>
        </div>
        <div class="batch-actions">
          <label class="checkbox-label"><input type="checkbox" id="selectAllMedia">전체 선택</label>
          <span id="selectionCount">0개 선택</span>
          <button id="downloadSelectedBtn" class="btn-action primary" type="button" disabled>선택 다운로드</button>
        </div>
        <details class="add-urls">
          <summary>여러 영상 주소 추가</summary>
          <label for="videoUrls">유튜브 등 영상 페이지 주소를 한 줄에 하나씩 입력하세요.</label>
          <textarea id="videoUrls" rows="3" placeholder="https://www.youtube.com/watch?v=..."></textarea>
          <button id="addVideoUrlsBtn" class="btn-action" type="button">목록에 추가</button>
        </details>
        <p id="downloadNotice" role="status" aria-live="polite">유튜브·MP3는 PC 보조 프로그램을 사용합니다.</p>
      </section>

      <div class="filter-options-bar">
        <label class="checkbox-label" for="hideSmallFilesCheck">
          <input type="checkbox" id="hideSmallFilesCheck" checked>
          <span data-i18n="hide_small_files">작은 파일 숨기기 (100KB 미만)</span>
        </label>
        <label class="checkbox-label" for="enableCopyProtectionBypassCheck">
          <input type="checkbox" id="enableCopyProtectionBypassCheck">
          <span data-i18n="enable_copy_protection_bypass">복사/드래그 방지 해제 (현재 탭)</span>
        </label>
      </div>

      <main class="media-list-container">
        <section id="downloadJobsSection" class="download-jobs" hidden>
          <div class="jobs-heading"><strong>다운로드 진행</strong><span id="batchProgressText"></span></div>
          <progress id="batchProgress" max="1" value="0" aria-label="전체 다운로드 처리"></progress>
          <ul id="downloadJobsList" class="media-list" aria-label="다운로드 작업"></ul>
        </section>
        <ul id="mediaList" class="media-list"></ul>
        <div id="emptyState" class="empty-state">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
            <line x1="7" y1="2" x2="7" y2="22"></line>
            <line x1="17" y1="2" x2="17" y2="22"></line>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <line x1="2" y1="7" x2="7" y2="7"></line>
            <line x1="2" y1="17" x2="7" y2="17"></line>
            <line x1="17" y1="17" x2="22" y2="17"></line>
            <line x1="17" y1="7" x2="22" y2="7"></line>
          </svg>
          <p data-i18n="no_media_found">감지된 미디어가 없습니다.</p>
        </div>
      </main>
    </div>

    <!-- 2. 동영상 변환 탭 영역 (WAV, MP3, GIF) -->
    <div id="videoConverterTabSection" class="tab-section">
      <div class="converter-container">
        <div id="videoDropZone" class="drop-zone">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
            <polygon points="10 8 16 12 10 16 10 8"></polygon>
          </svg>
          <p class="drop-text" data-i18n="video_drag_drop">동영상 파일(MP4, WEBM 등)을 드래그하거나 클릭</p>
          <input type="file" id="videoFileInput" accept="video/*" style="display: none;">
        </div>

        <div id="videoPreviewCard" class="image-preview-card" style="display: none;">
          <div class="preview-img-wrapper">
            <video id="previewVideo" style="width: 100%; height: 100%; object-fit: cover;"></video>
          </div>
          <div class="preview-details">
            <div id="videoPreviewFileName" class="preview-filename"></div>
            <div id="videoPreviewFileSize" class="preview-filesize"></div>
          </div>
        </div>

        <div class="converter-controls">
          <div class="control-row">
            <label class="control-label" data-i18n="convert_format">대상 포맷</label>
            <div class="format-chips">
              <button class="btn-video-format active" data-format="mp3" type="button">MP3 (음원)</button>
              <button class="btn-video-format" data-format="wav" type="button">WAV (무손실 음원)</button>
              <button class="btn-video-format" data-format="gif" type="button">GIF (움짤)</button>
            </div>
          </div>

          <!-- GIF 품질 설정 패널 -->
          <div id="gifSettingsPanel" class="settings-panel" style="display: none;">
            <div class="setting-subrow">
              <label class="control-label" data-i18n="gif_fps">프레임 레이트 (FPS)</label>
              <div class="chip-options">
                <button class="btn-fps" data-fps="5" type="button">5 FPS</button>
                <button class="btn-fps active" data-fps="10" type="button">10 FPS</button>
                <button class="btn-fps" data-fps="15" type="button">15 FPS</button>
              </div>
            </div>
            <div class="setting-subrow">
              <label class="control-label" data-i18n="gif_duration">변환 구간 (초)</label>
              <div class="chip-options">
                <button class="btn-duration" data-duration="3" type="button">3초</button>
                <button class="btn-duration active" data-duration="5" type="button">5초</button>
                <button class="btn-duration" data-duration="10" type="button">10초</button>
              </div>
            </div>
            <div class="setting-subrow">
              <label class="control-label" data-i18n="gif_resolution">해상도 (가로 너비)</label>
              <div class="chip-options">
                <button class="btn-res" data-res="240" type="button">240px (저용량)</button>
                <button class="btn-res active" data-res="320" type="button">320px (표준)</button>
                <button class="btn-res" data-res="480" type="button">480px (고화질)</button>
              </div>
            </div>
          </div>

          <!-- MP3 품질 설정 패널 -->
          <div id="audioSettingsPanel" class="settings-panel">
            <div class="setting-subrow">
              <label class="control-label" data-i18n="audio_bitrate">음원 비트레이트</label>
              <div class="chip-options">
                <button class="btn-bitrate" data-bitrate="128" type="button">128 kbps</button>
                <button class="btn-bitrate active" data-bitrate="192" type="button">192 kbps</button>
                <button class="btn-bitrate" data-bitrate="320" type="button">320 kbps (고음질)</button>
              </div>
            </div>
          </div>

          <button id="videoConvertBtn" class="btn-convert" type="button">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            <span data-i18n="convert_btn">변환 및 다운로드</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 3. 이미지 변환 탭 영역 (PNG, JPG, WEBP) -->
    <div id="imageConverterTabSection" class="tab-section">
      <div class="converter-container">
        <div id="dropZone" class="drop-zone">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <p class="drop-text" data-i18n="convert_drag_drop">이미지 파일(PNG, JPG 등)을 드래그하거나 클릭</p>
          <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
        </div>

        <div id="imagePreviewCard" class="image-preview-card" style="display: none;">
          <div class="preview-img-wrapper">
            <img id="previewImage" alt="Preview">
          </div>
          <div class="preview-details">
            <div id="previewFileName" class="preview-filename"></div>
            <div id="previewFileSize" class="preview-filesize"></div>
          </div>
        </div>

        <div class="converter-controls">
          <div class="control-row">
            <label class="control-label" data-i18n="convert_format">대상 포맷</label>
            <div class="format-chips">
              <button class="btn-format active" data-format="png" type="button">PNG</button>
              <button class="btn-format" data-format="jpeg" type="button">JPG</button>
              <button class="btn-format" data-format="webp" type="button">WEBP</button>
            </div>
          </div>

          <div class="control-row quality-row" id="qualityRow">
            <div class="quality-label-wrapper">
              <label class="control-label" data-i18n="convert_quality">품질</label>
              <span id="qualityValDisplay" class="quality-val">90%</span>
            </div>
            <input type="range" id="qualitySlider" min="10" max="100" value="90" class="quality-slider">
          </div>

          <button id="convertBtn" class="btn-convert" type="button">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            <span data-i18n="convert_btn">변환 및 다운로드</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="wavEncoder.js"></script>
  <script src="mp3Encoder.js"></script>
  <script src="gifEncoder.js"></script>
  <script src="videoConverter.js"></script>
  <script src="videoConverterController.js"></script>
  <script src="imageConverter.js"></script>
  <script src="unified_download_ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
